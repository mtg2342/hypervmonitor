<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyper-V Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    <header>
        <h1>Hyper-V Monitor</h1>
        <div class="header-controls">
            <div class="range-buttons" id="rangeButtons">
                <button class="range-btn active" data-range="1h">1H</button>
                <button class="range-btn" data-range="6h">6H</button>
                <button class="range-btn" data-range="24h">24H</button>
                <button class="range-btn" data-range="7d">7D</button>
                <button class="range-btn" data-range="30d">30D</button>
                <button class="range-btn" data-range="4m">4M</button>
            </div>
            <span class="last-poll" id="lastPoll">Waiting for data…</span>
        </div>
    </header>

    <main>
        <!-- Host KPI cards -->
        <div class="section-title">Host</div>
        <section class="host-cards" id="hostCards">
            <div class="card host-card" id="hostCpu">
                <div class="card-label">CPU</div>
                <div class="card-value" id="hostCpuVal">--<span style="font-size:16px;color:var(--text-3)">%</span></div>
                <canvas class="sparkline" id="sparkHostCpu" width="220" height="32"></canvas>
            </div>
            <div class="card host-card" id="hostMem">
                <div class="card-label">Memory</div>
                <div class="card-value" id="hostMemVal">--<span style="font-size:16px;color:var(--text-3)">%</span></div>
                <canvas class="sparkline" id="sparkHostMem" width="220" height="32"></canvas>
            </div>
            <div class="card host-card" id="hostDiskIo">
                <div class="card-label">Disk Read</div>
                <div class="card-value" id="hostDiskReadVal">--</div>
                <canvas class="sparkline" id="sparkHostDiskR" width="220" height="32"></canvas>
            </div>
            <div class="card host-card" id="hostDiskIoW">
                <div class="card-label">Disk Write</div>
                <div class="card-value" id="hostDiskWriteVal">--</div>
                <canvas class="sparkline" id="sparkHostDiskW" width="220" height="32"></canvas>
            </div>
            <div class="card host-card volumes-card" id="hostVolumes">
                <div class="card-label">Storage</div>
                <div id="volumesList"></div>
            </div>
        </section>

        <!-- Alerts -->
        <section class="alerts-banner" id="alertsBanner" style="display:none;">
            <div class="alerts-header">Active Alerts</div>
            <div id="alertsList"></div>
        </section>

        <!-- System + Events -->
        <div class="section-title">System Health</div>
        <section class="system-row">
            <div class="card system-info-card">
                <div class="card-label">Overview</div>
                <div class="sysinfo-grid">
                    <div class="sysinfo-item">
                        <span class="sysinfo-label">Host</span>
                        <span class="sysinfo-value" id="sysHost">--</span>
                    </div>
                    <div class="sysinfo-item">
                        <span class="sysinfo-label">OS</span>
                        <span class="sysinfo-value" id="sysOs">--</span>
                    </div>
                    <div class="sysinfo-item">
                        <span class="sysinfo-label">Uptime</span>
                        <span class="sysinfo-value" id="sysUptime">--</span>
                    </div>
                    <div class="sysinfo-item">
                        <span class="sysinfo-label">Last Boot</span>
                        <span class="sysinfo-value" id="sysLastBoot">--</span>
                    </div>
                    <div class="sysinfo-item" style="grid-column: 1 / -1;">
                        <span class="sysinfo-label">Pending Updates</span>
                        <span class="sysinfo-value" id="sysUpdates">--</span>
                    </div>
                </div>
                <div class="reboot-history">
                    <span class="sysinfo-label">Recent Reboots</span>
                    <ul id="rebootList" class="reboot-list"></ul>
                </div>
            </div>

            <div class="card events-card">
                <div class="card-label">
                    <span>High-Risk Events (24h)</span>
                    <span class="events-count" id="eventsCount"></span>
                </div>
                <div id="eventsList" class="events-list">
                    <div class="no-events">Loading events…</div>
                </div>
            </div>
        </section>

        <!-- VMs -->
        <div class="section-title" id="vmSectionTitle">Virtual Machines<span class="count" id="vmCount"></span></div>
        <section class="vm-grid" id="vmGrid"></section>

        <!-- Detail charts -->
        <div class="section-title">Time Series</div>
        <section class="detail-charts">
            <div class="chart-tabs" id="chartTabs">
                <button class="tab-btn active" data-tab="cpu">CPU</button>
                <button class="tab-btn" data-tab="memory">Memory</button>
                <button class="tab-btn" data-tab="network">Network</button>
                <button class="tab-btn" data-tab="diskio">Disk I/O</button>
                <button class="tab-btn" data-tab="storage">Storage</button>
            </div>
            <div class="chart-container">
                <canvas id="detailChart"></canvas>
            </div>
        </section>
    </main>

    <script src="/static/js/chart.umd.min.js"></script>
    <script src="/static/js/charts.js"></script>
    <script src="/static/js/alerts.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
